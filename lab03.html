<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="registerForm">
      <p>Register</p>
      <label for="email">Email</label>
      <input type="email" id="email" />
      <br />
      <br />
      <label for="password">Password</label>
      <input type="password" id="password" />
      <br />
      <br />
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" />
      <br />
      <br />
      <button type="submit" id="btn">Register</button>
    </form>

    <script>
      const form = document.getElementById("registerForm");
      const textRegister = document.getElementById("btn"); // Nên thêm const/let

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        // Lấy giá trị ra biến cho gọn và dễ đọc
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirm-password").value;

        // Sửa lại thành kiểm tra chuỗi rỗng ""
        if (email === "" || password === "" || confirmPassword === "") {
          alert("Vui long dien day du thong tin");
          textRegister.style.color = "orange";
        } else if (password !== confirmPassword) {
          alert("Mat khau khong khop");
          textRegister.style.border = "2px dashed red";
        } else {
          alert("Dang ky thanh cong");
          window.location.href = "welcome.html";
        }
      });
    </script>
  </body>
</html>
